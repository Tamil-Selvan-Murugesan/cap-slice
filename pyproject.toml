[project]
name = "cap-slice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tamil Selvan Murugesan", email = "tselvan482@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.130.0",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "qdrant-client>=1.19.1",
    "rapidocr-onnxruntime>=1.4.4",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "voyageai>=0.5.0",
]

[project.scripts]
cap-slice = "cap_slice:main"
cap-slice-download = "cap_slice.downloader:main"
cap-slice-index = "cap_slice.index:main"
cap-slice-search = "cap_slice.index:search_main"
cap-slice-compare = "cap_slice.compare_parsers:main"
cap-slice-parse = "cap_slice.batch_parse:main"
cap-slice-score = "cap_slice.score:main"
cap-slice-retrieval-score = "cap_slice.retrieval_score:main"
cap-slice-retrieval-bm25 = "cap_slice.retrieval_bm25:main"
cap-slice-periods = "cap_slice.periods:main"
cap-slice-query-reader = "cap_slice.query_reader:main"
cap-slice-retrieval-dense = "cap_slice.retrieval_dense:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# PyTorch (pulled in by docling) from the CPU-only index: the default Linux
# wheels bring several GB of CUDA libraries this laptop can't use.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
